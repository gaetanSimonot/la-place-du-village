<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <title>La Place — icône</title>
  <!--
    Le « P » en forme de repère de carte, relevé AU PIXEL sur le logo du
    Play Store : tête r=135 centrée (255,222), trou r=65,5, pied r=40 centré
    (157,395), bord gauche vertical à x=120.

    Le bord droit, entre la tête et le pied, n'est ni une tangente droite ni
    un congé circulaire — les deux ont été essayés et tombent à côté. C'est
    une Bézier, ajustée sur les pixels de la source.

    Fond OPAQUE : une icône transparente prend la couleur du système, et le
    P blanc disparaîtrait sur un thème clair.
  -->
  <defs><clipPath id="cadreA"><rect width="512" height="512"/></clipPath></defs>
  <g clip-path="url(#cadreA)">
    <rect width="512" height="512" fill="#CB4C1B"/>
    <path d="M350.5 126.5 L1050.5 826.5 L828.7 1123.3 L128.7 423.3 Z" fill="#B23D12"/>
    <path d="M255 87 A135 135 0 0 1 334 326 C310.8 354 198.7 339 197 392 A40 40 0 0 1 120 392 L120 222 A135 135 0 0 1 255 87 Z" fill="#FDF9F4"/>
    <circle cx="257" cy="222.5" r="65.5" fill="#CB4C1B"/>
  </g>
</svg>
